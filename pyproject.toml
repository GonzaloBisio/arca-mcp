[project]
name = "arca-mcp"
version = "0.1.0"
description = "Servidor MCP multi-emisor para facturación electrónica con ARCA (ex AFIP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "zeep>=4.2",
    "requests>=2.31",
    "cryptography>=42",
    "pydantic>=2.7",
    "pyyaml>=6",
    "uvicorn>=0.30",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
arca-mcp = "arca_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arca_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
